name: Build and deploy GitHub Pages

on:
  push:
    branches: [feat/cloud-portfolio-redesign]
  pull_request:
    branches: [feat/cloud-portfolio-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Check domain and resume in build output
        shell: bash
        run: |
          test "$(cat dist/CNAME)" = "raymondwquan.com"
          cmp public/resume.pdf dist/resume.pdf
          test -s dist/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Publish dist to Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/cloud-portfolio-redesign'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
